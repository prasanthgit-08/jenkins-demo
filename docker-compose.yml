services:

  mysql:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: company_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot-compose-app
    ports:
      - "8086:8081"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql-data:
